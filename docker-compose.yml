services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dechat
      POSTGRES_PASSWORD: dechat
      POSTGRES_DB: dechat
    volumes:
      - dechat_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dechat -d dechat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://dechat:dechat@db:5432/dechat?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_TTL: ${JWT_TTL:-24h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_TTL: ${TURN_TTL:-1h}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      target: caddy
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  dechat_db:
  caddy_data:
  caddy_config:
